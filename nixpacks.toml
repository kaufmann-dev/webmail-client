# Nixpacks' Node provider ships pnpm 9 and corepack 0.24.1, which cannot run the pinned pnpm 11.
[phases.install]
cmds = ["npx --yes pnpm@11.18.0 install --frozen-lockfile"]

[phases.build]
cmds = ["npx --yes pnpm@11.18.0 run build"]

# adapter-node binds $PORT; migrations run at startup.
[start]
cmd = "node build"
