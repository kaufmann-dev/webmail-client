<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Error %sveltekit.status% · Mail</title>
		<style>
			:root {
				color-scheme: light dark;
				--background: #fff;
				--foreground: oklch(0.21 0.006 265);
				--muted: oklch(0.45 0.01 265);
				--border: oklch(0.88 0.004 265);
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--background: oklch(0.165 0.006 265);
					--foreground: oklch(0.94 0.004 265);
					--muted: oklch(0.72 0.008 265);
					--border: oklch(0.32 0.007 265);
				}
			}
			body {
				box-sizing: border-box;
				display: grid;
				place-items: center;
				min-height: 100dvh;
				margin: 0;
				padding: 1rem;
				background: var(--background);
				color: var(--foreground);
				font-family: system-ui, sans-serif;
				text-align: center;
			}
			main {
				max-width: 28rem;
			}
			h1 {
				margin: 0;
				font-size: 1.25rem;
				font-weight: 600;
			}
			p {
				color: var(--muted);
				line-height: 1.5;
			}
			a {
				display: inline-block;
				padding: 0.5rem 1rem;
				border: 1px solid var(--border);
				border-radius: 0.375rem;
				color: inherit;
				font-weight: 500;
				text-decoration: none;
			}
			a:focus-visible {
				outline: 2px solid currentColor;
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Something went wrong</h1>
			<p>%sveltekit.error.message% (error %sveltekit.status%)</p>
			<a href="/">Back to inbox</a>
		</main>
	</body>
</html>
